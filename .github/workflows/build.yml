name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Check the mod jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar$')
          ls -l build/libs
          echo "Mod jar: $jar"
          unzip -l "$jar" | grep -E 'fabric.mod.json|Cobblecomputils.class|EvEditMenus.class|species_additions/bulbasaur.json'
          count=$(unzip -l "$jar" | grep -c 'species_additions/.*\.json$')
          echo "species additions in jar: $count"
          test "$count" -gt 1000

      - uses: actions/upload-artifact@v4
        with:
          name: cobblemoncompetitiveutils
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
